<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录展示 | 原生滑动版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条让界面更清爽 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 原生滑动容器，带有横向滚动吸附功能 */
        .native-slider {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            /* 增加惯性滑动 */
            -webkit-overflow-scrolling: touch; 
        }

        /* 每一张图片的容器，强制占满100%宽度并居中吸附 */
        .image-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
            filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.04));
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm h-16 flex items-center px-6 z-10 shrink-0">
        <h1 class="text-2xl font-bold text-blue-600">卡瑞思商品图册</h1>
    </header>

    <!-- 主体布局区 -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-[1600px] w-full mx-auto bg-white shadow-lg">

        <!-- 左侧：固定目录 -->
        <aside class="w-full md:w-64 bg-gray-50 border-r border-b md:border-b-0 border-gray-200 shrink-0 flex flex-col">
            <div class="p-4 border-b border-gray-200 hidden md:block">
                <h2 class="font-bold text-gray-600">产品目录</h2>
            </div>
            <nav id="catalog-list" class="flex md:flex-col overflow-x-auto md:overflow-y-auto no-scrollbar p-2 md:p-0 space-x-2 md:space-x-0 md:space-y-1">
                <!-- JS 生成目录 -->
            </nav>
        </aside>

        <!-- 中间：商品图片滑动区 -->
        <!-- 手机端固定高度 h-[50vh]，PC端自适应 -->
        <main class="w-full md:w-1/2 bg-gray-50 shrink-0 border-b md:border-b-0 md:border-r border-gray-200 relative h-[45vh] md:h-auto flex items-center justify-center">
            
            <!-- 原生滑动容器 -->
            <div id="image-slider" class="native-slider w-full h-full no-scrollbar">
                <!-- JS 会动态把商品图片塞进这里 -->
            </div>

            <!-- PC端左右按钮（手机端因为可以直接滑，所以隐藏） -->
            <button onclick="scrollLeftImage()" class="hidden md:flex absolute left-4 top-1/2 -translate-y-1/2 bg-white/90 w-10 h-10 rounded-full items-center justify-center shadow-md hover:bg-white text-blue-600 z-10 border border-gray-200 focus:outline-none">←</button>
            <button onclick="scrollRightImage()" class="hidden md:flex absolute right-4 top-1/2 -translate-y-1/2 bg-white/90 w-10 h-10 rounded-full items-center justify-center shadow-md hover:bg-white text-blue-600 z-10 border border-gray-200 focus:outline-none">→</button>
            
        </main>

        <!-- 右侧：商品介绍文字 -->
        <section class="w-full md:w-auto flex-1 p-6 md:p-8 overflow-y-auto">
            <div class="max-w-2xl">
                <span id="product-category" class="text-sm font-semibold text-blue-600 tracking-wider uppercase mb-2 block">产品分类</span>
                <h1 id="product-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 transition-opacity duration-300">商品名称</h1>
                <p id="product-price" class="text-2xl font-bold text-gray-700 mb-6 border-b pb-6 border-gray-200">¥ 0.00</p>
                
                <h3 class="text-lg font-bold text-gray-800 mb-2">产品说明</h3>
                <p id="product-desc" class="text-gray-600 leading-relaxed mb-8 whitespace-pre-line transition-opacity duration-300">这里是介绍文字...</p>
            </div>
        </section>

    </div>

    <script>
        // ==========================================
        // 📦 1. 商品数据
        // ==========================================
        const products = [
            {
                id: 1,
                title: "0701",
                category: "休闲鞋",
                price: "¥ 299.00",
                images: [
                    "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80", 
                    "https://images.unsplash.com/photo-1546938576-6e6a64f317cc?w=800&q=80",
                    "https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?w=800&q=80"
                ],
                desc: "0701男女同款休闲鞋\n帮面材质：头层牛皮\n内里材质：织物\n鞋底材质：巴斯夫爆米花底+TPU防滑贴片"
            },
            {
                id: 2,
                title: "0702",
                category: "运动鞋",
                price: "¥ 259.00",
                images: [
                    "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=800&q=80",
                    "https://images.unsplash.com/photo-1576243345690-4e4b79b63288?w=800&q=80"
                ],
                desc: "轻量化设计，网面透气。\n适合日常慢跑与休闲穿搭。"
            },
            {
                id: 3,
                title: "8811",
                category: "户外鞋",
                price: "¥ 459.00",
                images: [
                    "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=800&q=80",
                    "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800&q=80"
                ],
                desc: "防滑耐磨大底，适应各种复杂地形。\n防水鞋面，保持双脚干爽。"
            }
            // 继续添加更多产品...
        ];

        // ==========================================
        // ⚙️ 2. 系统渲染逻辑 (无需修改)
        // ==========================================
        
        const catalogList = document.getElementById('catalog-list');
        const productTitle = document.getElementById('product-title');
        const productPrice = document.getElementById('product-price');
        const productCategory = document.getElementById('product-category');
        const productDesc = document.getElementById('product-desc');
        const imageSlider = document.getElementById('image-slider');

        // 初始化左侧目录
        function initCatalog() {
            products.forEach((product, index) => {
                const btn = document.createElement('button');
                btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none";
                btn.innerHTML = `<span class="text-xs text-gray-400 block">${(index+1).toString().padStart(2, '0')}</span> ${product.title}`;
                btn.onclick = () => loadProduct(index);
                btn.id = `catalog-btn-${index}`;
                catalogList.appendChild(btn);
            });
            
            if(products.length > 0) {
                loadProduct(0);
            }
        }

        // 核心切换逻辑
        function loadProduct(index) {
            const product = products[index];

            // 1. 更新左侧高亮
            products.forEach((_, i) => {
                const btn = document.getElementById(`catalog-btn-${i}`);
                if (i === index) {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none bg-blue-600 text-white shadow-sm";
                } else {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none text-gray-600 hover:bg-gray-200";
                }
            });

            // 2. 更新右侧文字
            productTitle.style.opacity = 0;
            productDesc.style.opacity = 0;
            setTimeout(() => {
                productTitle.textContent = product.title;
                productCategory.textContent = product.category || '精选产品';
                productPrice.textContent = product.price || '面议';
                productDesc.textContent = product.desc;
                productTitle.style.opacity = 1;
                productDesc.style.opacity = 1;
            }, 200);

            // 3. 更新中间图片
            imageSlider.innerHTML = '';
            
            product.images.forEach(imgUrl => {
                const slide = document.createElement('div');
                slide.className = 'image-slide'; // 使用 CSS 定义的样式
                slide.innerHTML = `<img src="${imgUrl}" alt="${product.title}">`;
                imageSlider.appendChild(slide);
            });

            // 4. 每次切换商品，图片滚动回第一张
            imageSlider.scrollTo({ left: 0, behavior: 'auto' });
        }

        // PC端左右滑动按钮的逻辑
        function scrollLeftImage() {
            const width = imageSlider.clientWidth;
            imageSlider.scrollBy({ left: -width, behavior: 'smooth' });
        }

        function scrollRightImage() {
            const width = imageSlider.clientWidth;
            imageSlider.scrollBy({ left: width, behavior: 'smooth' });
        }

        // 启动
        initCatalog();
    </script>
</body>
</html>
