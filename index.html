<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录展示 | 高级交互版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 原生横向滑动 */
        .native-slider {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; 
        }

        .image-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .image-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
            cursor: zoom-in; /* 提示可以点击放大 */
        }

        /* 左右箭头样式 */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            transition: background 0.2s;
            user-select: none;
            font-weight: bold;
        }
        .nav-arrow:hover { background: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- 顶部导航 (固定在顶部) -->
    <header class="sticky top-0 z-50 bg-white shadow-sm h-16 flex items-center px-6">
        <h1 class="text-2xl font-bold text-blue-600">卡瑞思商品图册</h1>
    </header>

    <!-- 主体布局区 -->
    <div class="max-w-[1600px] w-full mx-auto bg-white shadow-lg min-h-screen flex flex-col md:flex-row">

        <!-- 左侧：固定目录 -->
        <!-- 手机端横向滚动，PC端左侧固定且独立滚动 -->
        <aside class="w-full md:w-64 bg-gray-50 border-r border-b md:border-b-0 border-gray-200 shrink-0 sticky top-16 z-40 md:h-[calc(100vh-4rem)] flex flex-col">
            <div class="p-4 border-b border-gray-200 hidden md:block">
                <h2 class="font-bold text-gray-600">产品目录</h2>
            </div>
            <nav id="catalog-list" class="flex md:flex-col overflow-x-auto md:overflow-y-auto no-scrollbar p-2 md:p-0 space-x-2 md:space-x-0 md:space-y-1 h-full">
                <!-- JS 生成目录 -->
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <div class="flex-1 flex flex-col">
            
            <!-- 中间：图片滑动区 (包含缩小动画) -->
            <!-- sticky top-16 保证向下滚动时图片贴在顶部，高度由 JS 动态改变 -->
            <div id="image-container" class="w-full bg-gray-50 sticky top-16 z-20 border-b border-gray-200 flex items-center justify-center transition-all duration-75"
                 style="height: 45vh; min-height: 200px;">
                
                <!-- 左箭头 -->
                <div class="nav-arrow left-2" onclick="slideImage(-1)">&lt;</div>

                <!-- 滑动容器 -->
                <div id="image-slider" class="native-slider w-full h-full no-scrollbar">
                    <!-- JS 塞入图片 -->
                </div>

                <!-- 右箭头 -->
                <div class="nav-arrow right-2" onclick="slideImage(1)">&gt;</div>
            </div>

            <!-- 文字介绍区 (随页面滚动) -->
            <section class="w-full p-6 md:p-10 bg-white z-10 relative">
                <div class="max-w-3xl">
                    <span id="product-category" class="text-sm font-semibold text-blue-600 tracking-wider uppercase mb-2 block">产品分类</span>
                    <h1 id="product-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 transition-opacity duration-300">商品名称</h1>
                    <p id="product-price" class="text-2xl font-bold text-gray-700 mb-6 border-b pb-6 border-gray-200">¥ 0.00</p>
                    
                    <h3 class="text-lg font-bold text-gray-800 mb-4">产品说明</h3>
                    <p id="product-desc" class="text-gray-600 leading-relaxed mb-8 whitespace-pre-line text-lg transition-opacity duration-300">这里是介绍文字...</p>
                </div>
            </section>

        </div>
    </div>

    <!-- 全屏图片放大预览层 (默认隐藏) -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4 cursor-zoom-out" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="大图预览" class="max-w-full max-h-full object-contain drop-shadow-2xl">
    </div>

    <script>
        // ==========================================
        // 📦 1. 商品数据
        // ==========================================
        const products = [
            {
                id: 1,
                title: "0701",
                category: "休闲鞋",
                price: "¥ 299.00",
                images: [
                    "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80", 
                    "https://images.unsplash.com/photo-1546938576-6e6a64f317cc?w=800&q=80",
                    "https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?w=800&q=80"
                ],
                desc: "0701男女同款休闲鞋\n帮面材质：头层牛皮\n内里材质：织物\n鞋底材质：巴斯夫爆米花底+TPU防滑贴片"
            },
            {
                id: 2,
                title: "0702",
                category: "运动鞋",
                price: "¥ 259.00",
                images: [
                    "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=800&q=80",
                    "https://images.unsplash.com/photo-1576243345690-4e4b79b63288?w=800&q=80"
                ],
                desc: "轻量化设计，网面透气。\n适合日常慢跑与休闲穿搭。"
            }
        ];

        // ==========================================
        // ⚙️ 2. 系统渲染与交互逻辑 (无需修改)
        // ==========================================
        
        const catalogList = document.getElementById('catalog-list');
        const productTitle = document.getElementById('product-title');
        const productPrice = document.getElementById('product-price');
        const productCategory = document.getElementById('product-category');
        const productDesc = document.getElementById('product-desc');
        const imageSlider = document.getElementById('image-slider');
        const imageContainer = document.getElementById('image-container');

        // 初始化目录
        function initCatalog() {
            products.forEach((product, index) => {
                const btn = document.createElement('button');
                btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none shrink-0";
                btn.innerHTML = `<span class="text-xs text-gray-400 block">${(index+1).toString().padStart(2, '0')}</span> ${product.title}`;
                btn.onclick = () => loadProduct(index);
                btn.id = `catalog-btn-${index}`;
                catalogList.appendChild(btn);
            });
            
            if(products.length > 0) {
                loadProduct(0);
            }
        }

        // 加载商品
        function loadProduct(index) {
            const product = products[index];

            // 更新左侧高亮
            products.forEach((_, i) => {
                const btn = document.getElementById(`catalog-btn-${i}`);
                if (i === index) {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none bg-blue-600 text-white shadow-sm shrink-0";
                } else {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none text-gray-600 hover:bg-gray-200 shrink-0";
                }
            });

            // 更新文字
            productTitle.style.opacity = 0;
            productDesc.style.opacity = 0;
            setTimeout(() => {
                productTitle.textContent = product.title;
                productCategory.textContent = product.category || '精选产品';
                productPrice.textContent = product.price || '面议';
                productDesc.textContent = product.desc;
                productTitle.style.opacity = 1;
                productDesc.style.opacity = 1;
            }, 200);

            // 更新图片
            imageSlider.innerHTML = '';
            product.images.forEach(imgUrl => {
                const slide = document.createElement('div');
                slide.className = 'image-slide';
                // 给图片绑定点击放大事件
                slide.innerHTML = `<img src="${imgUrl}" alt="${product.title}" onclick="openLightbox(this.src)">`;
                imageSlider.appendChild(slide);
            });

            // 切换商品时，恢复图片高度并回到页面顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
            imageContainer.style.height = '45vh';
            imageSlider.scrollTo({ left: 0, behavior: 'auto' });
        }

        // 左右箭头滑动逻辑
        function slideImage(direction) {
            const width = imageSlider.clientWidth;
            imageSlider.scrollBy({ left: width * direction, behavior: 'smooth' });
        }

        // ==========================================
        // 📜 3. 滑动滚动监听 (图片逐渐变小)
        // ==========================================
        window.addEventListener('scroll', () => {
            // 只在手机端(宽度<768)执行逐渐变小动画
            if (window.innerWidth < 768) {
                const scrollY = window.scrollY;
                const maxH = window.innerHeight * 0.45; // 初始高度 45vh
                const minH = 180; // 最小高度 180px
                
                // 滚动 150px 内完成缩小动画
                let newHeight = maxH - (scrollY * 1.5); 
                
                if (newHeight < minH) newHeight = minH;
                if (newHeight > maxH) newHeight = maxH;

                imageContainer.style.height = `${newHeight}px`;
            } else {
                // PC 端保持固定高度
                imageContainer.style.height = 'calc(100vh - 4rem)';
            }
        });

        // ==========================================
        // 🔍 4. 全屏放大预览
        // ==========================================
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            // 阻止背景滚动
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            lightboxImg.src = '';
            // 恢复背景滚动
            document.body.style.overflow = 'auto';
        }

        // 启动
        initCatalog();
    </script>
</body>
</html>
