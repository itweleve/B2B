<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录展示 | 多图滑动版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Swiper 轮播图 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 定制 Swiper 的样式，让滑动按钮好看一点 */
        .swiper-button-next, .swiper-button-prev {
            color: #2563eb; /* 蓝色 */
            background: rgba(255, 255, 255, 0.8);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px;
            font-weight: bold;
        }
        .swiper-pagination-bullet-active {
            background-color: #2563eb !important;
        }
        /* 确保图片居中且不变形 */
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm h-16 flex items-center px-6 z-10 shrink-0">
        <h1 class="text-2xl font-bold text-blue-600">YourBrand 精选图册</h1>
    </header>

    <!-- 主体布局区 -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-[1600px] w-full mx-auto bg-white shadow-lg">

        <!-- 左侧：固定目录 -->
        <aside class="w-full md:w-64 bg-gray-50 border-r border-b md:border-b-0 border-gray-200 shrink-0 flex flex-col">
            <div class="p-4 border-b border-gray-200 hidden md:block">
                <h2 class="font-bold text-gray-600">产品目录</h2>
            </div>
            <nav id="catalog-list" class="flex md:flex-col overflow-x-auto md:overflow-y-auto no-scrollbar p-2 md:p-0 space-x-2 md:space-x-0 md:space-y-1">
                <!-- JS 生成目录 -->
            </nav>
        </aside>

        <!-- 中间：商品图片滑动区 (Swiper) -->
        <main class="w-full md:w-1/2 bg-gray-50 flex items-center justify-center h-[45vh] md:h-auto shrink-0 border-b md:border-b-0 md:border-r border-gray-200 relative">
            
            <!-- Swiper 容器 -->
            <div class="swiper mySwiper w-full h-full">
                <div id="swiper-wrapper" class="swiper-wrapper">
                    <!-- JS 会动态把商品图片塞进这里 -->
                </div>
                <!-- 左右箭头和底部小圆点 -->
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>

        </main>

        <!-- 右侧：商品介绍文字 -->
        <section class="w-full md:w-auto flex-1 p-8 overflow-y-auto">
            <div class="max-w-2xl">
                <span id="product-category" class="text-sm font-semibold text-blue-600 tracking-wider uppercase mb-2 block">产品分类</span>
                <h1 id="product-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 transition-opacity duration-300">商品名称</h1>
                <p id="product-price" class="text-2xl font-bold text-gray-700 mb-6 border-b pb-6 border-gray-200">¥ 0.00</p>
                
                <h3 class="text-lg font-bold text-gray-800 mb-2">产品说明</h3>
                <p id="product-desc" class="text-gray-600 leading-relaxed mb-8 whitespace-pre-line transition-opacity duration-300">这里是介绍文字...</p>

                <div class="bg-blue-50 p-6 rounded-lg mt-8">
                    <h4 class="font-bold text-blue-800 mb-2">获取详细报价单</h4>
                    <p class="text-sm text-blue-600 mb-4">如果您对该产品感兴趣，请联系我们。</p>
                    <a href="mailto:your-email@example.com" class="inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">发送邮件咨询</a>
                </div>
            </div>
        </section>

    </div>

    <!-- 引入 Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // ==========================================
        // 📦 1. 在这里修改你的商品数据
        // ==========================================
        // ⚠️ 注意：images 现在是一个数组 [ ]，里面可以放多张图片的链接。
        // 用英文逗号隔开，每一行放一个网址。
        const products = [
            {
                id: 1,
                title: "0801",
                category: "休闲鞋",
                price: "¥ 299.00",
                images: [
                    "https://beeimg.us.ci/temp/6ae3370c5d142.jpg", 
                    "https://beeimg.us.ci/temp/6ae337132fcdb.jpg",
                    "https://beeimg.us.ci/temp/6ae3371c581ab.jpg",
                    "https://beeimg.us.ci/temp/6ae33722bbb87.jpg",
                    "https://beeimg.us.ci/temp/6ae33728c055b.jpg"
                ],
                desc: "0801男女同款休闲鞋\n帮面材质：头层牛皮\n内里材质：织物\n鞋底材质：巴斯夫爆米花底+TPU防滑贴片"
            },
            {
                id: 2,
                title: "智能运动手环",
                category: "穿戴设备",
                price: "¥ 199.00",
                images: [
                    "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=800&q=80",
                    "https://images.unsplash.com/photo-1576243345690-4e4b79b63288?w=800&q=80"
                ],
                desc: "全天候心率监测与血氧检测。\n支持20种运动模式，5ATM防水。\n超长续航，一次充电可用14天。"
            },
            {
                id: 3,
                title: "便携式咖啡机",
                category: "生活电器",
                price: "¥ 459.00",
                images: [
                    "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=800&q=80",
                    "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800&q=80"
                ],
                desc: "无需插电，手动按压萃取。\n兼容胶囊与咖啡粉，随时随地享受意式浓缩。\n食品级材质，小巧轻便易携带。"
            }
            // 继续往下复制花括号 {} 添加更多商品，直到 20 个...
        ];

        // ==========================================
        // ⚙️ 2. 系统渲染逻辑 (不需要修改)
        // ==========================================
        
        const catalogList = document.getElementById('catalog-list');
        const productTitle = document.getElementById('product-title');
        const productPrice = document.getElementById('product-price');
        const productCategory = document.getElementById('product-category');
        const productDesc = document.getElementById('product-desc');
        const swiperWrapper = document.getElementById('swiper-wrapper');

        let swiperInstance = null; // 存放滑动组件的实例

        // 初始化 Swiper
        function initSwiper() {
            swiperInstance = new Swiper(".mySwiper", {
                loop: false,
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
            });
        }

        // 生成左侧目录
        function initCatalog() {
            products.forEach((product, index) => {
                const btn = document.createElement('button');
                btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none";
                btn.innerHTML = `<span class="text-xs text-gray-400 block">${(index+1).toString().padStart(2, '0')}</span> ${product.title}`;
                btn.onclick = () => loadProduct(index);
                btn.id = `catalog-btn-${index}`;
                catalogList.appendChild(btn);
            });
            
            if(products.length > 0) {
                loadProduct(0);
                initSwiper(); // 首次初始化轮播图
            }
        }

        // 核心切换逻辑
        function loadProduct(index) {
            const product = products[index];

            // 1. 更新左侧高亮
            products.forEach((_, i) => {
                const btn = document.getElementById(`catalog-btn-${i}`);
                if (i === index) {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none bg-blue-600 text-white shadow-sm";
                } else {
                    btn.className = "text-left px-4 py-3 whitespace-nowrap md:whitespace-normal rounded-md transition-colors duration-200 focus:outline-none text-gray-600 hover:bg-gray-200";
                }
            });

            // 2. 更新右侧文字（加一点淡出淡入效果）
            productTitle.style.opacity = 0;
            productDesc.style.opacity = 0;
            setTimeout(() => {
                productTitle.textContent = product.title;
                productCategory.textContent = product.category || '精选产品';
                productPrice.textContent = product.price || '面议';
                productDesc.textContent = product.desc;
                productTitle.style.opacity = 1;
                productDesc.style.opacity = 1;
            }, 200);

            // 3. 更新中间轮播图图片
            // 清空旧图片
            swiperWrapper.innerHTML = '';
            
            // 遍历当前商品的 images 数组，生成新的 slide
            product.images.forEach(imgUrl => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `<img src="${imgUrl}" alt="${product.title}" class="max-w-full max-h-full object-contain drop-shadow-lg rounded-lg">`;
                swiperWrapper.appendChild(slide);
            });

            // 4. 通知 Swiper 更新数据并回到第一张
            if (swiperInstance) {
                swiperInstance.update(); // 刷新组件
                swiperInstance.slideTo(0); // 回到第一张
            }
        }

        // 启动
        initCatalog();
    </script>
</body>
</html>
